name: Iny iOS
on:
  workflow_dispatch:
  push:
    branches: [master, main]
permissions:
  contents: read
concurrency:
  group: iny-ios-${{ github.ref }}
  cancel-in-progress: true
jobs:
  core:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: swift-actions/setup-swift@v2
        with:
          swift-version: '6.0.3'
      - name: Run storage and WebDAV regression tests
        run: swift test
  compile:
    needs: core
    runs-on: macos-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - name: Run core regression tests
        run: swift test
      - uses: actions/cache@v4
        with:
          path: ~/Library/Caches/CocoaPods
          key: iny-vlc-${{ runner.os }}-${{ hashFiles('Podfile') }}
      - name: Install VLC
        run: pod install --repo-update
      - name: Compile iPhone and iPad simulator app
        run: |
          mkdir -p build
          set -o pipefail
          xcodebuild -workspace Iny.xcworkspace -scheme Iny -configuration Debug \
            -sdk iphonesimulator -destination 'generic/platform=iOS Simulator' \
            -derivedDataPath build/DerivedData CODE_SIGNING_ALLOWED=NO \
            build 2>&1 | tee build/simulator.log
          ditto -c -k --sequesterRsrc --keepParent \
            build/DerivedData/Build/Products/Debug-iphonesimulator/Iny.app build/Iny-simulator.zip
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: Iny-iOS-build
          path: |
            build/simulator.log
            build/Iny-simulator.zip
