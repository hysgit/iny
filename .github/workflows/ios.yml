name: Iny iOS
on:
  workflow_dispatch:
  push:
    branches: [master, main]
permissions:
  contents: read
concurrency:
  group: iny-ios-${{ github.ref }}
  cancel-in-progress: true
jobs:
  core:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: swift-actions/setup-swift@v2
        with:
          swift-version: '6.0.3'
      - name: Run storage and WebDAV regression tests
        run: swift test
  compile:
    needs: core
    runs-on: macos-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - name: Run core regression tests
        run: swift test
      - uses: actions/cache@v4
        with:
          path: ~/Library/Caches/CocoaPods
          key: iny-vlc-${{ runner.os }}-${{ hashFiles('Podfile') }}
      - name: Install VLC
        run: pod install --repo-update
      - name: Compile iPhone and iPad simulator app
        run: |
          mkdir -p build
          set -o pipefail
          xcodebuild -workspace Iny.xcworkspace -scheme Iny -configuration Debug \
            -sdk iphonesimulator -destination 'generic/platform=iOS Simulator' \
            -derivedDataPath build/DerivedData CODE_SIGNING_ALLOWED=NO ARCHS="$(uname -m)" ONLY_ACTIVE_ARCH=YES \
            build 2>&1 | tee build/simulator.log
          ditto -c -k --sequesterRsrc --keepParent \
            build/DerivedData/Build/Products/Debug-iphonesimulator/Iny.app build/Iny-simulator.zip
      - name: Launch iPhone for actual playback verification
        run: python3 scripts/simulator_smoke.py --app build/DerivedData/Build/Products/Debug-iphonesimulator/Iny.app --fixture UITests/Fixtures/playback.mp4 --family iPhone
      - name: Verify real video playback, pause and saved progress
        run: |
          SIMULATOR_ID=$(python3 -c "import json; print(next(x['udid'] for x in json.load(open('build/previews/launches.json')) if x['family']=='iPhone'))")
          set -o pipefail
          xcodebuild test -workspace Iny.xcworkspace -scheme Iny -configuration Debug \
            -destination "platform=iOS Simulator,id=$SIMULATOR_ID,arch=$(uname -m)" \
            -derivedDataPath build/DerivedData -parallel-testing-enabled NO \
            -only-testing:InyUITests -resultBundlePath build/Playback.xcresult \
            CODE_SIGNING_ALLOWED=NO ARCHS="$(uname -m)" ONLY_ACTIVE_ARCH=YES 2>&1 | tee build/playback.log
          python3 scripts/verify_playback.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: Iny-iOS-build
          path: |
            build/simulator.log
            build/playback.log
            build/Iny-simulator.zip
            build/previews/
